version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: beautyglowry_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: beautyglowry_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: beautyglowry_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beautyglowry_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:password@postgres:5432/beautyglowry_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      NEXTAUTH_SECRET: "beautyglowry-auth-secret-key-123456"
      REFRESH_TOKEN_SECRET: "beautyglowry-refresh-secret-key-abcdef"
      PORT: 3000
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
